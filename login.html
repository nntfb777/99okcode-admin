<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Hệ thống Quản trị</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center relative overflow-hidden font-sans">
    
    <div class="absolute w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 top-0 left-10 animate-blob"></div>
    <div class="absolute w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 bottom-0 right-10 animate-blob animation-delay-2000"></div>

    <div class="z-10 w-full max-w-md p-8 bg-slate-800/80 backdrop-blur-xl rounded-2xl shadow-2xl border border-slate-700/50">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                <i class="fa-solid fa-shield-halved text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Hệ Thống Quản Trị</h2>
            <p class="text-slate-400 mt-2">Vui lòng đăng nhập để tiếp tục</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div id="errBox" class="hidden bg-red-500/10 border border-red-500/50 p-3 rounded-lg flex items-center gap-3 text-red-400 text-sm">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errMsg"></span>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-300 ml-1">Tài khoản</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                    <input type="text" id="username" required
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-slate-200 transition-all placeholder:text-slate-600"
                        placeholder="Tên đăng nhập">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-300 ml-1">Mật khẩu</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <input type="password" id="password" required
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-slate-200 transition-all placeholder:text-slate-600"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="loginBtn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                <span>Đăng Nhập</span>
                <i id="btnLoading" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </form>
    </div>

    <script src="js/login.js"></script> 
</body>


</html>
