<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <title>Hệ Thống Quản Trị 79Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dropdown:hover .dropdown-menu { display: block; }
        /* Đảm bảo input luôn hiển thị chữ rõ ràng */
        input::placeholder { color: #9ca3af; }
    </style>
    <script src="js/auth.js"></script> 
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
    <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                <div class="flex items-center bg-indigo-800 rounded-lg px-2 py-1.5 border border-indigo-500">
                    <i class="fa-solid fa-layer-group text-yellow-400 mr-2 text-xl"></i>
                    <select id="siteSelector" class="bg-transparent text-white text-xs font-bold focus:outline-none cursor-pointer">
                        <option value="79king" class="text-gray-800">79KING</option>
                        <option value="99ok" class="text-gray-800">99OK</option>
                        <option value="okking" class="text-gray-800">OKKING</option>
                        <option value="kl99" class="text-gray-800">KL99</option>
                    </select>
                </div>
                    <div class="hidden md:flex space-x-1">
                        <a href="/" class="px-3 py-2 rounded-md hover:bg-indigo-600 transition">Tổng quan</a>
                        <a href="/quan-ly-ma" class="px-3 py-2 rounded-md hover:bg-indigo-600 transition">Quản Lý Mã</a>
                        <a href="/lich-su" class="px-3 py-2 rounded-md hover:bg-indigo-600 transitio">Lịch Sử Nhập</a>
                        <a href="/quan-ly-tai-khoan" class="px-3 py-2 rounded-md bg-indigo-800 transition">Quản Lý Tài Khoản</a>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-sm">
                    <span>Xin chào, <b id="adminNameDisplay" class="text-white">Admin</b></span>
                    <button onclick="Auth.logout()"class="text-indigo-200 hover:text-white transition">
                        <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex items-center gap-2 mb-8">
            <i class="fa-solid fa-users-gear text-indigo-600 text-2xl"></i>
            <h1 class="text-2xl font-bold text-gray-800">Thiết Lập Tài Khoản</h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="font-bold mb-4 text-gray-700 uppercase text-sm tracking-wider border-b pb-2">Đổi Mật Khẩu Cá Nhân</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Mật khẩu hiện tại</label>
                            <input type="password" id="oldPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Mật khẩu mới</label>
                            <input type="password" id="newPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <button id="btnChangeMyPassword" class="w-full bg-slate-800 text-white py-2 rounded-lg font-bold hover:bg-slate-900 transition">
                            CẬP NHẬT MẬT KHẨU
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2" id="superAdminSection" style="display: none;">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-8">
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 class="font-bold text-gray-800 uppercase text-sm tracking-wider">Danh Sách Quản Trị Viên</h3>
                        <button onclick="openAddUserModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700 transition flex items-center gap-2">
                            <i class="fa-solid fa-user-plus"></i> THÊM TÀI KHOẢN PHỤ
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-white text-xs uppercase text-gray-500 border-b">
                                <tr>
                                    <th class="px-6 py-4 font-bold">Tên đăng nhập</th>
                                    <th class="px-6 py-4 font-bold text-center">Chức vụ</th>
                                    <th class="px-6 py-4 font-bold text-center">Ngày tạo</th>
                                    <th class="px-6 py-4 font-bold text-right">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="adminTableBody" class="text-sm divide-y divide-gray-50">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/quan-ly-tai-khoan.js"></script>

    <footer class="text-center py-8 text-gray-400 text-xs border-t border-gray-200 mt-10">
        &copy; 2026 99OK CODE System - Manager Harold
    </footer>

</body>
</html>
